name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: bash -n plugins/vstack/skills/adversarial-review/scripts/run_adversarial_review.sh
      - run: bash -n plugins/vstack/skills/show-me-your-work/scripts/log.sh
